[roles.root]
keys = ["arlosi", "arlosi-backup", "walterhpearce"]
threshold = 2
lifetime = "60d"
renew = "7d"

[roles.targets]
keys = ["arlosi", "arlosi-backup", "walterhpearce"]
threshold = 2
lifetime = "60d"
renew = "7d"

[roles.snapshot]
keys = ["online"]
threshold = 1
lifetime = "14d"
renew = "7d"

[roles.timestamp]
keys = ["online"]
threshold = 1
lifetime = "8d"
renew = "2d"

[[delegations]]
name = "rustup"
